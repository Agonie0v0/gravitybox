name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build, Privacy, Rust & Unit Tests (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            windows/app/package-lock.json

      - name: Cache Cargo registry & build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            windows/win-helper/target
            windows/app/src-tauri/target
          key: cargo-win-${{ hashFiles('windows/win-helper/Cargo.lock', 'windows/app/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-win-

      - name: Install Node dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix windows/app ci --ignore-scripts --no-audit --no-fund

      - name: Build TypeScript backend
        run: npm run build

      - name: Run privacy gate
        run: npm run check:privacy

      - name: Run Win32 helper Rust tests
        working-directory: windows/win-helper
        run: cargo test

      - name: Build Win32 helper release binary
        working-directory: windows/win-helper
        run: cargo build --release

      - name: Build Windows desktop frontend
        run: npm --prefix windows/app run build

      - name: Run Windows desktop Tauri Rust tests
        working-directory: windows/app/src-tauri
        run: cargo test

      - name: Run unit & integration tests
        run: npm run test:unit
